<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reports | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/admin/assets/css/style.css" rel="stylesheet">
  </head>
  <body data-page="reports" data-title="Reports">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="content-shell">
        <header id="topbar" class="topbar"></header>
        <main class="main-content">
          <div id="reports-alert"></div>

          <section class="content-panel">
            <div class="panel-header">
              <div>
                <h2>Reports</h2>
                <p>Generate and export filtered reports</p>
              </div>
            </div>

            <div class="report-generator">
              <div class="report-type-selector mb-3">
                <div class="btn-group" role="group">
                  <button type="button" class="btn btn-outline-primary report-type-btn active" data-report-type="students">
                    <i class="bi bi-people"></i> Students
                  </button>
                  <button type="button" class="btn btn-outline-primary report-type-btn" data-report-type="attendance">
                    <i class="bi bi-calendar-check"></i> Attendance
                  </button>
                  <button type="button" class="btn btn-outline-primary report-type-btn" data-report-type="fees">
                    <i class="bi bi-cash-coin"></i> Fees
                  </button>
                  <button type="button" class="btn btn-outline-primary report-type-btn" data-report-type="courses">
                    <i class="bi bi-journal-bookmark"></i> Courses
                  </button>
                </div>
              </div>

              <div id="report-filters" class="filter-section mb-3">
                <div class="row g-3">
                  <div class="col-md-4 filter-field" data-filter="search">
                    <label for="report-search" class="form-label">Search</label>
                    <input id="report-search" class="form-control" type="search" placeholder="Search...">
                  </div>
                  <div class="col-md-4 filter-field" data-filter="course">
                    <label for="report-course" class="form-label">Course</label>
                    <select id="report-course" class="form-select">
                      <option value="">All courses</option>
                    </select>
                  </div>
                  <div class="col-md-4 filter-field" data-filter="status">
                    <label for="report-status" class="form-label">Status</label>
                    <select id="report-status" class="form-select">
                      <option value="">All</option>
                    </select>
                  </div>
                  <div class="col-md-4 filter-field" data-filter="student">
                    <label for="report-student" class="form-label">Student</label>
                    <select id="report-student" class="form-select">
                      <option value="">All students</option>
                    </select>
                  </div>
                  <div class="col-md-4 filter-field" data-filter="start-date">
                    <label for="report-start-date" class="form-label">Start Date</label>
                    <input id="report-start-date" class="form-control" type="date">
                  </div>
                  <div class="col-md-4 filter-field" data-filter="end-date">
                    <label for="report-end-date" class="form-label">End Date</label>
                    <input id="report-end-date" class="form-control" type="date">
                  </div>
                  <div class="col-md-4 filter-field" data-filter="created-from">
                    <label for="report-created-from" class="form-label">Created From</label>
                    <input id="report-created-from" class="form-control" type="date">
                  </div>
                  <div class="col-md-4 filter-field" data-filter="created-to">
                    <label for="report-created-to" class="form-label">Created To</label>
                    <input id="report-created-to" class="form-control" type="date">
                  </div>
                  <div class="col-md-4 filter-field" data-filter="due-from">
                    <label for="report-due-from" class="form-label">Due From</label>
                    <input id="report-due-from" class="form-control" type="date">
                  </div>
                  <div class="col-md-4 filter-field" data-filter="due-to">
                    <label for="report-due-to" class="form-label">Due To</label>
                    <input id="report-due-to" class="form-control" type="date">
                  </div>
                  <div class="col-md-4 filter-field" data-filter="active">
                    <label for="report-active" class="form-label">Active Status</label>
                    <select id="report-active" class="form-select">
                      <option value="">All</option>
                      <option value="true">Active</option>
                      <option value="false">Inactive</option>
                    </select>
                  </div>
                  <div class="col-md-4 filter-field d-flex align-items-end" data-filter="detail">
                    <div class="form-check">
                      <input id="report-detail" class="form-check-input" type="checkbox">
                      <label for="report-detail" class="form-check-label">Detailed attendance</label>
                    </div>
                  </div>
                </div>
              </div>

              <div class="toolbar mb-3">
                <button id="generate-report" class="btn btn-primary" type="button">
                  <i class="bi bi-funnel"></i>
                  Generate Report
                </button>
                <button id="export-csv" class="btn btn-outline-secondary" type="button">
                  <i class="bi bi-filetype-csv"></i>
                  Export CSV
                </button>
                <button id="export-pdf" class="btn btn-outline-secondary" type="button">
                  <i class="bi bi-filetype-pdf"></i>
                  Export PDF
                </button>
              </div>

              <div id="report-loading" class="d-none">
                <div class="alert alert-info">
                  <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                  Generating report...
                </div>
              </div>

              <div id="report-summary" class="report-summary d-none"></div>

              <div id="report-result" class="d-none">
                <div class="table-responsive">
                  <table id="report-table" class="table align-middle table-hover">
                    <thead></thead>
                    <tbody></tbody>
                  </table>
                </div>
                <div id="report-pagination"></div>
              </div>

              <div id="report-empty" class="d-none">
                <div class="alert alert-warning">No records match the selected report filters.</div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/admin/assets/js/common.js"></script>
    <script src="/admin/assets/js/reports.js"></script>
  </body>
</html>
