<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Courses | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/admin/assets/css/style.css" rel="stylesheet">
  </head>
  <body data-page="courses" data-title="Courses">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="content-shell">
        <header id="topbar" class="topbar"></header>
        <main class="main-content">
          <div id="courses-alert"></div>

          <section class="content-panel">
            <div class="panel-header panel-header-actions">
              <div>
                <h2>Courses</h2>
                <p>Course catalog and availability</p>
              </div>
              <div class="toolbar">
                <div class="input-icon">
                  <i class="bi bi-search"></i>
                  <input id="course-search" class="form-control" type="search" placeholder="Search courses" aria-label="Search courses">
                </div>
                <button id="open-add-course" class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#courseModal">
                  <i class="bi bi-plus-lg"></i>
                  Add Course
                </button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table align-middle table-hover">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Course Name</th>
                    <th>Duration</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="courses-table-body">
                  <tr>
                    <td colspan="6" class="text-center text-muted py-4">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div class="modal fade" id="courseModal" tabindex="-1" aria-labelledby="courseModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="course-form">
            <div class="modal-header">
              <h5 id="courseModalTitle" class="modal-title">Add Course</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="course-form-alert"></div>
              <input id="course-id" type="hidden">

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="course-code" class="form-label">Course Code</label>
                  <input id="course-code" class="form-control" type="text" required maxlength="50">
                </div>
                <div class="col-md-6">
                  <label for="course-name" class="form-label">Course Name</label>
                  <input id="course-name" class="form-control" type="text" required maxlength="150">
                </div>
                <div class="col-md-12">
                  <label for="course-description" class="form-label">Description</label>
                  <textarea id="course-description" class="form-control" rows="3" maxlength="500"></textarea>
                </div>
                <div class="col-md-6">
                  <label for="course-duration" class="form-label">Duration in Months</label>
                  <input id="course-duration" class="form-control" type="number" min="1" step="1">
                </div>
                <div id="course-active-field" class="col-md-6 d-none">
                  <label for="course-active" class="form-label">Active Status</label>
                  <select id="course-active" class="form-select">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
              <button id="save-course" type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i>
                Save Course
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/admin/assets/js/common.js"></script>
    <script src="/admin/assets/js/courses.js"></script>
  </body>
</html>
