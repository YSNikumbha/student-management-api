<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/admin/assets/css/style.css" rel="stylesheet">
  </head>
  <body data-page="users" data-title="Users">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="content-shell">
        <header id="topbar" class="topbar"></header>
        <main class="main-content">
          <div id="users-alert"></div>

          <section class="content-panel">
            <div class="panel-header panel-header-actions">
              <div>
                <h2>Users</h2>
                <p>User accounts and role access</p>
              </div>
              <div class="toolbar">
                <button id="open-add-user" class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#userModal">
                  <i class="bi bi-plus-lg"></i>
                  Add User
                </button>
              </div>
            </div>

            <div class="filter-row mb-3">
              <div class="input-icon">
                <i class="bi bi-search"></i>
                <input id="user-search" class="form-control" type="search" placeholder="Search users" aria-label="Search users">
              </div>
              <select id="user-role-filter" class="form-select" aria-label="Filter by role">
                <option value="">All roles</option>
                <option value="admin">Admin</option>
                <option value="teacher">Teacher</option>
                <option value="accountant">Accountant</option>
                <option value="staff">Staff</option>
              </select>
              <select id="user-active-filter" class="form-select" aria-label="Filter by status">
                <option value="">All statuses</option>
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
              <select id="user-page-size" class="form-select" aria-label="Rows per page">
                <option value="10">10 rows</option>
                <option value="25">25 rows</option>
                <option value="50">50 rows</option>
              </select>
            </div>

            <div class="table-responsive">
              <table class="table align-middle table-hover">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Last Login</th>
                    <th>Created</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="users-table-body">
                  <tr>
                    <td colspan="7" class="text-center text-muted py-4">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div id="users-pagination"></div>
          </section>
        </main>
      </div>
    </div>

    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="user-form">
            <div class="modal-header">
              <h5 id="userModalTitle" class="modal-title">Add User</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="user-form-alert"></div>
              <input id="user-id" type="hidden">

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="user-name" class="form-label">Name</label>
                  <input id="user-name" class="form-control" type="text" required maxlength="150">
                </div>
                <div class="col-md-6">
                  <label for="user-email" class="form-label">Email</label>
                  <input id="user-email" class="form-control" type="email" required maxlength="255">
                </div>
                <div class="col-md-6">
                  <label for="user-role" class="form-label">Role</label>
                  <select id="user-role" class="form-select" required>
                    <option value="teacher">Teacher</option>
                    <option value="accountant">Accountant</option>
                    <option value="admin">Admin</option>
                    <option value="staff">Staff (Legacy)</option>
                  </select>
                </div>
                <div id="user-active-field" class="col-md-6 d-none">
                  <label for="user-active" class="form-label">Status</label>
                  <select id="user-active" class="form-select">
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                  </select>
                </div>
                <div id="user-password-field" class="col-md-6">
                  <label for="user-password" class="form-label">Temporary Password</label>
                  <input id="user-password" class="form-control" type="password" autocomplete="new-password" minlength="8">
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
              <button id="save-user" type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i>
                Save User
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="userViewModal" tabindex="-1" aria-labelledby="userViewModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 id="userViewModalTitle" class="modal-title">User Details</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div id="user-view-content"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="passwordResetModal" tabindex="-1" aria-labelledby="passwordResetModalTitle" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="password-reset-form">
            <div class="modal-header">
              <h5 id="passwordResetModalTitle" class="modal-title">Reset Password</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="password-reset-alert"></div>
              <input id="password-reset-user-id" type="hidden">
              <label for="password-reset-value" class="form-label">New Temporary Password</label>
              <input id="password-reset-value" class="form-control" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
              <button id="save-password-reset" type="submit" class="btn btn-primary">
                <i class="bi bi-key"></i>
                Reset Password
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/admin/assets/js/common.js"></script>
    <script src="/admin/assets/js/users.js"></script>
  </body>
</html>
