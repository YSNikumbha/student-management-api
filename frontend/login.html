<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/admin/assets/css/style.css" rel="stylesheet">
  </head>
  <body class="login-page" data-public-page="true">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <div class="login-brand">
          <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
          <div>
            <h1 id="login-title">Student Management System</h1>
            <p>Admin and staff login</p>
          </div>
        </div>

        <div id="login-alert"></div>

        <form id="login-form">
          <div class="mb-3">
            <label for="login-email" class="form-label">Email</label>
            <input id="login-email" class="form-control" type="email" autocomplete="email" required>
          </div>
          <div class="mb-4">
            <label for="login-password" class="form-label">Password</label>
            <input id="login-password" class="form-control" type="password" autocomplete="current-password" required>
          </div>
          <button id="login-button" class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right"></i>
            Login
          </button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/admin/assets/js/common.js"></script>
    <script src="/admin/assets/js/login.js"></script>
  </body>
</html>
