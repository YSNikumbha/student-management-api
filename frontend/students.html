<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/admin/assets/css/style.css" rel="stylesheet">
  </head>
  <body data-page="students" data-title="Students">
    <div class="app-shell">
      <aside id="sidebar" class="sidebar"></aside>
      <div class="content-shell">
        <header id="topbar" class="topbar"></header>
        <main class="main-content">
          <div id="students-alert"></div>

          <section class="content-panel">
            <div class="panel-header panel-header-actions">
              <div>
                <h2>Students</h2>
                <p>Student records and course assignment</p>
              </div>
              <div class="toolbar">
                <div class="input-icon">
                  <i class="bi bi-search"></i>
                  <input id="student-search" class="form-control" type="search" placeholder="Search students" aria-label="Search students">
                </div>
                <button id="open-add-student" class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#studentModal">
                  <i class="bi bi-plus-lg"></i>
                  Add Student
                </button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table align-middle table-hover">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Student Code</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="students-table-body">
                  <tr>
                    <td colspan="8" class="text-center text-muted py-4">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="studentModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <form id="student-form">
            <div class="modal-header">
              <h5 id="studentModalTitle" class="modal-title">Add Student</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="student-form-alert"></div>
              <input id="student-id" type="hidden">

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="student-code" class="form-label">Student Code</label>
                  <input id="student-code" class="form-control" type="text" required maxlength="50">
                </div>
                <div class="col-md-6">
                  <label for="student-email" class="form-label">Email</label>
                  <input id="student-email" class="form-control" type="email" required maxlength="255">
                </div>
                <div class="col-md-6">
                  <label for="student-first-name" class="form-label">First Name</label>
                  <input id="student-first-name" class="form-control" type="text" required maxlength="100">
                </div>
                <div class="col-md-6">
                  <label for="student-last-name" class="form-label">Last Name</label>
                  <input id="student-last-name" class="form-control" type="text" required maxlength="100">
                </div>
                <div class="col-md-6">
                  <label for="student-phone" class="form-label">Phone</label>
                  <input id="student-phone" class="form-control" type="text" maxlength="20">
                </div>
                <div class="col-md-6">
                  <label for="student-date-of-birth" class="form-label">Date of Birth</label>
                  <input id="student-date-of-birth" class="form-control" type="date">
                </div>
                <div class="col-md-6">
                  <label for="student-course" class="form-label">Course</label>
                  <select id="student-course" class="form-select"></select>
                </div>
                <div id="student-status-field" class="col-md-6 d-none">
                  <label for="student-status" class="form-label">Status</label>
                  <select id="student-status" class="form-select">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
              <button id="save-student" type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i>
                Save Student
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/admin/assets/js/common.js"></script>
    <script src="/admin/assets/js/students.js"></script>
  </body>
</html>
